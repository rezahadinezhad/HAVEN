[package]
name = "haven-crypto-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
openmls = { version = "=0.9.2", features = ["js"] }
openmls_traits = "=0.6.0"
openmls_rust_crypto = "=0.6.0"
openmls_basic_credential = "=0.6.0"
openmls_memory_storage = "=0.6.0"
tls_codec = "=0.5.0"
wasm-bindgen = "=0.2.105"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "=0.10.9"
getrandom_legacy = { package = "getrandom", version = "=0.2.17", features = ["js"] }
[profile.release]
opt-level = "s"
lto = true

[dev-dependencies]
proptest = "=1.12.0"

# Backport upstream provider dependency migration without changing OpenMLS 0.9.2.
[patch.crates-io]
openmls_rust_crypto = { path = "vendor/openmls_rust_crypto" }
openmls_basic_credential = { path = "vendor/basic_credential" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
