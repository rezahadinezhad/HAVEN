[project]
name = "haven-api"
version = "0.2.0"
requires-python = ">=3.12,<3.15"
dependencies = [
  "Django>=5.2,<5.3",
  "djangorestframework>=3.18.3,<3.19",
  "channels>=4.3,<4.4",
  "channels-redis>=4.3,<4.4",
  "uvicorn[standard]>=0.38,<1",
  "psycopg[binary]>=3.2,<3.4",
  "argon2-cffi>=25.1,<26",
  "redis>=8.1.0,<9",
  "cryptography>=50.0.2,<51",
  "rfc8785==0.1.4",
]
[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-django>=4.11,<5",
    "pytest-asyncio>=1,<2",
    "ruff>=0.14,<0.16",
    "pip-audit>=2.9,<3",
    "jsonschema==4.25.1",
]
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "haven.settings"
python_files = ["test_*.py"]
asyncio_mode = "auto"
addopts = "--tb=short"
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
