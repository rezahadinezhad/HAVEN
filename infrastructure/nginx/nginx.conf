worker_processes auto;
# Nginx error records can contain complete request URLs (including invite tokens).
# Use bounded application counters/health checks; enable diagnostics only with synthetic traffic.
error_log /dev/null;
pid /var/run/nginx.pid;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  # Docker service IPs can change during a rolling recreation. Re-resolve them without stale upstreams.
  resolver 127.0.0.11 valid=5s ipv6=off;
  upstream haven_api { zone haven_api 64k; server api:8100 resolve; }
  upstream haven_web { zone haven_web 64k; server web:3100 resolve; }
  access_log off;
  client_max_body_size 1400k;
  # The maximum accepted ciphertext chunk fits in memory; do not spool request
  # bodies or upstream responses into long-lived container/host temporary files.
  client_body_buffer_size 1400k;
  proxy_request_buffering off;
  proxy_buffering off;
  proxy_max_temp_file_size 0;
  client_body_timeout 15s;
  send_timeout 30s;
  keepalive_timeout 30s;
  limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
  limit_conn_zone $binary_remote_addr zone=connections:10m;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  server {
    listen 443 ssl;
    ssl_certificate /etc/haven/tls/leaf.crt;
    ssl_certificate_key /etc/haven/tls/leaf.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    ssl_session_cache shared:TLS:10m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
    limit_conn connections 20;
    location /api/ {
      limit_req zone=api burst=30 nodelay;
      proxy_pass http://haven_api;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Real-IP "";
      proxy_set_header X-Forwarded-For "";
      proxy_set_header Forwarded "";
      proxy_set_header X-Client-IP "";
      proxy_set_header True-Client-IP "";
      proxy_set_header CF-Connecting-IP "";
      proxy_set_header X-Forwarded-Host "";
      proxy_read_timeout 30s;
    }
    location /ws/ {
      limit_req zone=api burst=30 nodelay;
      proxy_pass http://haven_api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $http_host;
      proxy_set_header Origin $http_origin;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Real-IP "";
      proxy_set_header X-Forwarded-For "";
      proxy_set_header Forwarded "";
      proxy_set_header X-Client-IP "";
      proxy_set_header True-Client-IP "";
      proxy_set_header CF-Connecting-IP "";
      proxy_set_header X-Forwarded-Host "";
      proxy_read_timeout 90s;
    }
    location / {
      proxy_pass http://haven_web;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Real-IP "";
      proxy_set_header X-Forwarded-For "";
      proxy_set_header Forwarded "";
      proxy_set_header X-Client-IP "";
      proxy_set_header True-Client-IP "";
      proxy_set_header CF-Connecting-IP "";
      proxy_set_header X-Forwarded-Host "";
    }
  }
}
