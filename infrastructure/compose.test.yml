name: haven-test
services:
  db:
    image: postgres:16.14-bookworm@sha256:64154d0babcb1741988719e703419af0382b19953706149f9872fbd0f438efa8
    environment:
      POSTGRES_DB: haven
      POSTGRES_USER: haven
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U haven"]
      interval: 2s
      timeout: 2s
      retries: 20
  redis:
    image: redis:7.4.6-alpine@sha256:3b73847e72874be07e6657b129a94761662b79bc0f679273757d4218573b2a98
    ports: ["127.0.0.1:56379:6379"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
volumes:
  db:
