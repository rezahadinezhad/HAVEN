<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="780" viewBox="0 0 1120 780" role="img" aria-labelledby="title description"><title id="title">HAVEN architecture — device and service responsibilities</title><desc id="description">The client interface coordinates OpenMLS encryption and encrypted local storage. HTTPS carries ciphertext, public proofs and authentication to the Django API. PostgreSQL is durable; workers and Redis provide maintenance and transient hints. An independent retirement journal guards SQL restoration. The service sees active metadata; unlocked devices expose plaintext to trusted local code. This is a responsibility map, not a network topology.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#1769f4"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><rect width="1120" height="780" rx="16" fill="#f3f6fb"/>
<text x="36" y="48" fill="#182332" font-size="30" font-weight="700">Different responsibilities. Clear trust boundaries.</text>
<rect x="30" y="82" width="430" height="576" rx="12" fill="#ffffff" stroke="#ccd9ee"/><text x="55" y="122" fill="#1769f4" font-size="26" font-weight="700">Your device</text><text x="55" y="152" fill="#596879" font-size="19" font-weight="400">Private state while unlocked</text>
<rect x="55" y="188" width="380" height="88" rx="12" fill="#edf3ff" stroke="#ccd9ee"/><text x="77" y="224" fill="#182332" font-size="23" font-weight="700">Conversation interface</text><text x="77" y="254" fill="#596879" font-size="18" font-weight="400">Verification, consent and local use</text>
<path d="M245 277 L245 311" fill="none" stroke="#1769f4" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="55" y="318" width="380" height="98" rx="12" fill="#ffffff" stroke="#ccd9ee"/><text x="77" y="354" fill="#182332" font-size="23" font-weight="700">Rust / OpenMLS worker</text><text x="77" y="387" fill="#596879" font-size="19" font-weight="400">Encrypt and verify messages</text>
<path d="M55 250 H42 V508 H54" fill="none" stroke="#1769f4" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="55" y="452" width="380" height="112" rx="12" fill="#ffffff" stroke="#ccd9ee"/><text x="77" y="488" fill="#182332" font-size="23" font-weight="700">Encrypted local storage</text><text x="77" y="521" fill="#596879" font-size="19" font-weight="400">Vault · History · Drafts · Outbox</text>
<text x="55" y="608" fill="#596879" font-size="19" font-weight="400">Plaintext and unwrapped keys can</text><text x="55" y="636" fill="#596879" font-size="19" font-weight="400">exist in memory while unlocked.</text>
<rect x="650" y="82" width="440" height="576" rx="12" fill="#ffffff" stroke="#ccd9ee"/><text x="675" y="122" fill="#1769f4" font-size="26" font-weight="700">Messaging service</text><text x="675" y="152" fill="#596879" font-size="19" font-weight="400">Authenticated coordination</text>
<rect x="675" y="188" width="390" height="88" rx="12" fill="#edf3ff" stroke="#ccd9ee"/><text x="696" y="224" fill="#182332" font-size="23" font-weight="700">Django API</text><text x="696" y="254" fill="#596879" font-size="18" font-weight="400">Current authority and ordered delivery</text>
<path d="M880 277 L880 311" fill="none" stroke="#1769f4" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="675" y="318" width="390" height="98" rx="12" fill="#ffffff" stroke="#ccd9ee"/><text x="696" y="354" fill="#182332" font-size="23" font-weight="700">PostgreSQL</text><text x="696" y="387" fill="#596879" font-size="18" font-weight="400">Durable ciphertext and public records</text>
<path d="M880 418 L880 445" fill="none" stroke="#1769f4" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="675" y="452" width="390" height="112" rx="12" fill="#ffffff" stroke="#ccd9ee"/><text x="696" y="488" fill="#182332" font-size="23" font-weight="700">Workers and Redis hints</text><text x="696" y="521" fill="#596879" font-size="18" font-weight="400">Notifications · Retention · Retirement</text>
<text x="675" y="608" fill="#596879" font-size="19" font-weight="400">Active relationships and routing</text><text x="675" y="636" fill="#596879" font-size="19" font-weight="400">remain visible to the service.</text>
<path d="M437 231 L671 231" fill="none" stroke="#1769f4" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="489" y="199" fill="#1769f4" font-size="21" font-weight="700">HTTPS</text><text x="482" y="276" fill="#596879" font-size="18" font-weight="400">Ciphertext</text><text x="482" y="303" fill="#596879" font-size="18" font-weight="400">Public proofs</text><text x="482" y="330" fill="#596879" font-size="18" font-weight="400">Authentication</text>
<rect x="30" y="686" width="1060" height="64" rx="12" fill="#edf3ff" stroke="#ccd9ee"/><text x="53" y="725" fill="#182332" font-size="21" font-weight="700">Independent retirement journal · Retirement records kept outside SQL backups</text></g></svg>
