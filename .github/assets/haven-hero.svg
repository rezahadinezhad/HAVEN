<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title description"><title id="title">HAVEN — Private conversations. Explicit trust.</title><desc id="description">A self-hosted messenger for small trusted communities. Keys and readable history belong on the device; the service coordinates delivery and routing. Independent security review is pending.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#1769f4"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><rect width="1200" height="320" rx="16" fill="#f3f6fb"/><g transform="translate(44 36)"><rect width="42" height="42" rx="12" fill="#1769f4"/><path d="M11 12h21v15H21l-8 6v-6h-2z" fill="none" stroke="white" stroke-width="2" stroke-linejoin="round"/><g fill="white"><circle cx="17" cy="19.5" r="1.2"/><circle cx="22" cy="19.5" r="1.2"/><circle cx="27" cy="19.5" r="1.2"/></g></g><text x="101" y="65" fill="#182332" font-size="25" font-weight="700">HAVEN</text><text x="44" y="156" fill="#182332" font-size="47" font-weight="700">Private conversations.</text><text x="44" y="215" fill="#182332" font-size="47" font-weight="700">Explicit trust.</text><text x="46" y="275" fill="#596879" font-size="21" font-weight="400">For small, trusted communities.</text><rect x="690" y="68" width="458" height="84" rx="12" fill="#ffffff" stroke="#ccd9ee"/><text x="716" y="103" fill="#1769f4" font-size="23" font-weight="700">On your device</text><text x="716" y="133" fill="#596879" font-size="21" font-weight="400">Keys and readable history</text><path d="M916 153 L916 182" fill="none" stroke="#1769f4" stroke-width="2.5"/><rect x="690" y="184" width="458" height="84" rx="12" fill="#edf3ff" stroke="#ccd9ee"/><text x="716" y="219" fill="#1769f4" font-size="23" font-weight="700">On your service</text><text x="716" y="249" fill="#596879" font-size="21" fon