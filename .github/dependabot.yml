version: 2
updates:
  - package-ecosystem: uv
    directory: /apps/api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: cargo
    directory: /packages/crypto-core
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directories:
      - /apps/api
      - /apps/web
    # Django 5.2 and the project's requires-python exclude Python 3.15+.
    # Revisit with a separately qualified framework/runtime migration.
    ignore:
      - dependency-name: python
        versions: [">=3.15"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
